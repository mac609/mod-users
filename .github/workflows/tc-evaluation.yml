
name: TC Module Evaluation

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'Repository URL to evaluate'
        required: false
        type: string
        default: 'https://github.com/folio-org/mod-users'
      ref:
        description: 'Git ref to evaluate'
        required: false
        type: string
        default: 'v19.6.2'
      output_format:
        description: 'Report format'
        required: false
        type: choice
        options:
          - both
          - json-only
          - html-only
        default: 'both'
      criteria_filter:
        description: 'Comma-separated criterion IDs; leave empty for all'
        required: false
        type: string
      java_version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'

jobs:
  evaluate:
    permissions:
      contents: read
    uses: folio-org/tc-module-eval/.github/workflows/evaluate.yml@master
    with:
      repository_url: ${{ inputs.repository_url }}
      ref: ${{ inputs.ref }}
      output_format: ${{ inputs.output_format }}
      criteria_filter: ${{ inputs.criteria_filter }}
      java_version: ${{ inputs.java_version }}
      node_version: ${{ inputs.node_version }}
